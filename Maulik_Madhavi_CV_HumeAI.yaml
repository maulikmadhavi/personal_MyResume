  sections:
    summary:
      - "AI Research Engineer with 12+ years in speech and audio understanding, specializing in the expressive and paralinguistic layer of voice — prosody, speaker identity, and acoustic inference of human state. Fine-tunes speech transformers and ships production audio-visual systems at million-scale. Seeking to build speech-language models that understand not just what people say, but how they express it."
    experience:
      - company: NCS Pte Ltd, Singapore
        position: Senior AI Engineer
        previous_position: Video Analytics Researcher
        start_date: 2021-04
        highlights:
          - "Designed and implemented **million-scale face indexing system** supporting real-time search with distributed feature extraction, retrieval, and ranking pipelines"
          - "Built person and vehicle detection models with attribute recognition; optimized for production inference latency and throughput at scale"
          - "Developed backend infrastructure for **video search and summarization platform** handling massive video datasets with distributed preprocessing and model inference optimization"
          - "Built production **prompt studio platform** integrating audio-visual feature extraction with text understanding for efficient content analysis"
      - company: National University of Singapore (NUS), Singapore
        position: Research Fellow
        start_date: 2017-12
        end_date: 2021-04
        highlights:
          - "Designed and deployed **backend dialogue system** for autonomous vehicles supporting multi-modal conversations integrating speech understanding with semantic search"
          - "**Enhanced Automatic Speech Recognition (ASR) system** for healthcare by fine-tuning language models to Singaporean English, achieving significant Word Error Rate (WER) improvements through domain adaptation"
          - "Developed **text-dependent speaker verification system** optimized for mobile deployment with low-latency, low-memory inference"
          - "Built automated form-filling system for call centers using NLU to extract structured information from **noisy ASR-generated transcripts** handling speech variability"
          - "Mentored researchers on speech processing and deep learning for audio applications"
      - company: Dhirubhai Ambani Institute of Information and Communication Technology (DA-IICT), Gandhinagar
        position: Project Personnel
        start_date: 2012-04
        end_date: 2014-06
        highlights:
          - "Developed **phonetic engine** for Gujarati and Marathi languages capturing phonetic transcription (IPA), syllabification, and prosodic information"
          - "Designed **HMM-based phoneme recognition** with spectral analysis for segmentation and suprasegmental feature extraction"
          - "Built **audio search pipeline** for spoken content retrieval and discovery across Indian language processing applications"
          - "Processed multi-source audio recordings (read speech, spontaneous, lectures) from different dialectal regions"
